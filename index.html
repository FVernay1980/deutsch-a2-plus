<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155e49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Deutsch A2+</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#19372f;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}.app{max-width:540px;margin:auto;padding:22px 18px 45px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:25px;margin:0}h2{font-size:22px;margin:0 0 12px}.muted{color:#667970;font-size:14px}.card{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 3px 18px #0a32210d}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{flex:1;padding:12px 5px;border:0;border-radius:13px;background:#e6eee9;color:#205743;font-weight:700}.tab.active,.primary{background:#16634a;color:white}.primary{border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;width:100%;margin-top:12px}.secondary{border:1px solid #b6d3c5;background:white;color:#155e49;border-radius:12px;padding:11px 14px;font-weight:650}.option{display:block;width:100%;text-align:left;border:2px solid #e2ece6;background:white;padding:15px;border-radius:13px;margin:9px 0;font-size:16px;color:#183c2c}.option.selected{border-color:#16634a;background:#e8f4ed}.option:disabled{opacity:.8}.tag{display:inline-block;background:#e5f2eb;border-radius:30px;padding:7px 11px;color:#146045;font-size:12px;font-weight:700}.sentence{font-size:23px;font-weight:750;line-height:1.35;margin:16px 0}.feedback{padding:14px;border-radius:12px;background:#e8f5eb;margin-top:15px;line-height:1.5}.feedback.bad{background:#fff0e6}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}.progress{height:9px;background:#e3ece7;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#1a8b64;transition:width .2s}.stat{font-size:30px;font-weight:800}.small{font-size:13px}.hidden{display:none}input[type=text]{width:100%;font-size:17px;padding:14px;border:2px solid #cbded3;border-radius:12px}footer{font-size:12px;color:#76867d;margin-top:30px;text-align:center}</style></head><body><main class="app"><header><div><h1>🇩🇪 Deutsch A2+</h1><div class="muted">Ton allemand, un peu chaque jour</div></div><span class="tag">A2 → B1</span></header><nav class="tabs"><button class="tab active" data-tab="learn">Apprendre</button><button class="tab" data-tab="review">Réviser</button><button class="tab" data-tab="progress">Progrès</button></nav><section id="screen"></section><footer>V0.1.1 · Données conservées sur cet appareil</footer></main><script>
const LESSONS=[{id:'daily',title:'Vie quotidienne',description:'Transports, rendez-vous et achats',questions:[{type:'choice',prompt:'Complète la phrase',sentence:'Ich fahre mit ___ Auto zur Arbeit.',options:['der','dem','das','den'],answer:'dem',audio:'Ich fahre mit dem Auto zur Arbeit.',explanation:'La préposition « mit » demande toujours le datif. « das Auto » devient « dem Auto ».'},{type:'choice',prompt:'Choisis la bonne traduction',sentence:'Je dois prendre rendez-vous demain.',options:['Ich muss morgen einen Termin vereinbaren.','Ich bin morgen einen Termin.','Ich mache gestern einen Termin.'],answer:'Ich muss morgen einen Termin vereinbaren.',audio:'Ich muss morgen einen Termin vereinbaren.',explanation:'« einen Termin vereinbaren » signifie prendre rendez-vous.'},{type:'choice',prompt:'Complète la phrase',sentence:'Ich warte ___ den Bus.',options:['für','auf','mit','bei'],answer:'auf',audio:'Ich warte auf den Bus.',explanation:'« warten auf » est suivi de l’accusatif.'},{type:'choice',prompt:'Choisis la bonne phrase',sentence:'Parce qu’il pleut, je reste à la maison.',options:['Weil es regnet, bleibe ich zu Hause.','Weil es regnet, ich bleibe zu Hause.','Weil regnet es, bleibe ich zu Hause.'],answer:'Weil es regnet, bleibe ich zu Hause.',audio:'Weil es regnet, bleibe ich zu Hause.',explanation:'Après « weil », le verbe conjugué va à la fin de la subordonnée.'},{type:'input',prompt:'Complète avec le bon mot',sentence:'Ich habe gestern Brot ___.',answer:'gekauft',audio:'Ich habe gestern Brot gekauft.',explanation:'Le participe passé de « kaufen » est « gekauft ».'}]},{id:'work',title:'Allemand professionnel',description:'Réunions, maintenance et production',questions:[{type:'choice',prompt:'Choisis la bonne traduction',sentence:'La machine est en panne.',options:['Die Maschine ist kaputt.','Die Maschine hat spät.','Die Maschine ist fertig.'],answer:'Die Maschine ist kaputt.',audio:'Die Maschine ist kaputt.',explanation:'« kaputt » signifie cassé ou en panne dans la langue courante.'},{type:'choice',prompt:'Complète la phrase',sentence:'Wir müssen ___ Fehler finden.',options:['der','den','dem','des'],answer:'den',audio:'Wir müssen den Fehler finden.',explanation:'« finden » prend un complément à l’accusatif : « den Fehler ».'},{type:'choice',prompt:'Choisis la bonne traduction',sentence:'Pouvez-vous vérifier le capteur ?',options:['Können Sie den Sensor überprüfen?','Müssen Sie der Sensor prüfen?','Sind Sie den Sensor?'],answer:'Können Sie den Sensor überprüfen?',audio:'Können Sie den Sensor überprüfen?',explanation:'« Können Sie ...? » est une demande polie ; « überprüfen » signifie vérifier.'},{type:'choice',prompt:'Complète la phrase',sentence:'Die Produktion beginnt ___ acht Uhr.',options:['um','am','im','zu'],answer:'um',audio:'Die Produktion beginnt um acht Uhr.',explanation:'Pour indiquer une heure précise, on utilise « um ».'},{type:'input',prompt:'Complète avec le bon mot',sentence:'Wir haben ein technisches ___.',answer:'Problem',audio:'Wir haben ein technisches Problem.',explanation:'« das Problem » est neutre ; après « ein », l’adjectif prend ici la terminaison -es.'}]}];
const KEY='deutsch-a2-plus-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{done:0,correct:0,mistakes:{},sessions:[]}}catch{state={done:0,correct:0,mistakes:{},sessions:[]}};let tab='learn',queue=[],pos=0,selected='',checked=false,score=0,mode='';const screen=document.getElementById('screen');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let currentGermanUtterance=null;
function speak(s){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    alert('La synthèse vocale n’est pas disponible sur cet appareil.');return;
  }
  const synth=window.speechSynthesis;
  synth.cancel();
  const utterance=new SpeechSynthesisUtterance(s);
  utterance.lang='de-DE';utterance.rate=1;utterance.pitch=1;utterance.volume=1;
  const voices=synth.getVoices().filter(v=>/^de(?:-|$)/i.test(v.lang));
  if(voices.length)utterance.voice=voices.find(v=>v.lang.toLowerCase()==='de-de')||voices[0];
  const button=document.getElementById('speak');
  if(button)button.textContent='🔊 Lecture…';
  const restore=()=>{if(currentGermanUtterance===utterance){const b=document.getElementById('speak');if(b)b.textContent='🔊 Écouter la phrase';}};
  utterance.onend=restore;
  utterance.onerror=e=>{restore();if(e.error!=='canceled'&&e.error!=='interrupted')alert('Lecture audio indisponible ('+e.error+').');};
  currentGermanUtterance=utterance;
  synth.speak(utterance);
  if(synth.paused)synth.resume();
}
function allQuestions(){return LESSONS.flatMap(l=>l.questions.map((q,i)=>({...q,key:l.id+'-'+i,lesson:l.title})))}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='learn'){screen.innerHTML='<h2>Choisis une leçon</h2><p class="muted">5 exercices par session · environ 5 minutes</p>'+LESSONS.map(l=>`<div class="card"><span class="tag">${l.questions.length} exercices</span><h2 style="margin-top:12px">${l.title}</h2><p class="muted">${l.description}</p><button class="primary" data-start="${l.id}">Commencer</button></div>`).join('')}else if(tab==='review'){const qs=allQuestions().filter(q=>state.mistakes[q.key]>0);screen.innerHTML=`<h2>Mes révisions</h2><div class="card"><div class="stat">${qs.length}</div><p class="muted">Question${qs.length>1?'s':''} à retravailler</p>${qs.length?'<button class="primary" id="reviewStart">Réviser maintenant</button>':'<p>Bravo ! Aucune erreur à réviser pour le moment.</p>'}</div>`}else{const pct=state.done?Math.round(state.correct/state.done*100):0;screen.innerHTML=`<h2>Ma progression</h2><div class="card"><div class="stat">${state.done}</div><p class="muted">Questions répondues</p></div><div class="card"><div class="stat">${pct}%</div><p class="muted">Réponses correctes</p><div class="progress"><div class="fill" style="width:${pct}%"></div></div></div><div class="card"><div class="stat">${state.sessions.length}</div><p class="muted">Sessions terminées</p></div><button class="secondary" id="reset">Réinitialiser mes données</button>`}}
function start(qs,m){queue=qs;pos=0;score=0;mode=m;showQuestion()}function showQuestion(){selected='';checked=false;if(pos>=queue.length){state.sessions.push({date:new Date().toISOString(),mode,score,total:queue.length});save();screen.innerHTML=`<div class="card"><span class="tag">Session terminée</span><h2 style="margin-top:15px">Bien joué ! 🎉</h2><div class="stat">${score} / ${queue.length}</div><p class="muted">Tu peux revoir les erreurs dans l’onglet Réviser.</p><button class="primary" id="back">Retour à l’accueil</button></div>`;return}const q=queue[pos];screen.innerHTML=`<div class="card"><span class="tag">${escapeHTML(q.lesson)}</span><p class="muted">Question ${pos+1} sur ${queue.length}</p><div class="progress"><div class="fill" style="width:${pos/queue.length*100}%"></div></div><h2>${escapeHTML(q.prompt)}</h2><div class="sentence">${escapeHTML(q.sentence)}</div><button class="secondary" id="speak">🔊 Écouter la phrase</button><p class="muted small" style="margin:9px 0 0">Sur iPhone, désactive le mode silencieux pour entendre la prononciation.</p><div id="choices">${q.type==='choice'?q.options.map((o,i)=>`<button class="option" data-option="${i}">${escapeHTML(o)}</button>`).join(''):'<p class="muted">Écris le mot manquant :</p><input type="text" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse">'}</div><div id="feedback"></div><button class="primary" id="check" disabled>Vérifier</button></div>`}
function check(){const q=queue[pos];if(!selected||checked)return;checked=true;const ok=selected.trim().toLocaleLowerCase('de')===q.answer.toLocaleLowerCase('de');state.done++;if(ok){state.correct++;score++;delete state.mistakes[q.key]}else state.mistakes[q.key]=(state.mistakes[q.key]||0)+1;save();document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'✓ Richtig !':'À revoir'}</strong><p>Bonne réponse : <strong>${escapeHTML(q.answer)}</strong></p><p>${escapeHTML(q.explanation)}</p></div>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);const input=document.getElementById('typed');if(input)input.disabled=true;const btn=document.getElementById('check');btn.textContent=pos===queue.length-1?'Terminer':'Continuer';btn.disabled=false}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render()}else if(t.dataset.start){const l=LESSONS.find(l=>l.id===t.dataset.start);start(l.questions.map((q,i)=>({...q,key:l.id+'-'+i,lesson:l.title})),l.title)}else if(t.id==='reviewStart'){start(allQuestions().filter(q=>state.mistakes[q.key]>0),'Révisions')}else if(t.id==='speak'){speak(queue[pos].audio)}else if(t.dataset.option!==undefined&&!checked){selected=queue[pos].options[Number(t.dataset.option)];document.querySelectorAll('.option').forEach(b=>b.classList.toggle('selected',b===t));document.getElementById('check').disabled=false}else if(t.id==='check'){if(checked){pos++;showQuestion()}else check()}else if(t.id==='back'){tab='learn';render()}else if(t.id==='reset'){if(confirm('Effacer toute ta progression sur cet iPhone ?')){state={done:0,correct:0,mistakes:{},sessions:[]};save();render()}}});document.addEventListener('input',e=>{if(e.target.id==='typed'){selected=e.target.value;document.getElementById('check').disabled=!selected.trim()}});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
